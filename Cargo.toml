[package]
name = "republisher"
version = "0.2.0"
edition = "2021"
license = "Apache-2.0"
rust-version = "1.93"
description = "Generic, extensible industrial-protocol MQTT republisher (BACnet/Modbus/OPC UA)."
repository = "https://github.com/NETIX-AI-OSS/netix-republisher"
default-run = "republisher"

# Workspace root only; vendored bacnet-transport excluded via [patch].
[workspace]
exclude = ["vendor/bacnet-transport"]

[features]
default = ["gui"]
# The iced desktop GUI (`republisher` binary).
gui = ["republish-core/gui"]
# Headless web-GUI daemon (republisherd): axum API + SSE + browser UI.
web = [
    "dep:argon2",
    "dep:axum",
    "dep:axum-server",
    "dep:rand",
    "dep:serde",
    "dep:subtle",
    "dep:tokio",
    "dep:tokio-stream",
]

[[bin]]
name = "republisher"
path = "src/main.rs"
required-features = ["gui"]

[[bin]]
name = "write_config"
path = "src/bin/write_config.rs"

[[bin]]
name = "republisherd"
path = "src/bin/republisherd.rs"
required-features = ["web"]

[build-dependencies]
winresource = "0.1"

[dependencies]
anyhow = "1.0"
serde_json = "1.0"
proto-api = { git = "https://github.com/NETIX-AI-OSS/netix-protocol-core", tag = "v0.1.4-core" }
# Adapter libs from netix-protocol-core; gui feature opts into iced GUI.
republish-core = { git = "https://github.com/NETIX-AI-OSS/netix-protocol-core", tag = "v0.1.4-core", default-features = false }
proto-bacnet = { git = "https://github.com/NETIX-AI-OSS/netix-protocol-core", tag = "v0.1.4-core", features = ["republish"] }
proto-modbus = { git = "https://github.com/NETIX-AI-OSS/netix-protocol-core", tag = "v0.1.4-core", features = ["republish"] }
proto-opcua = { git = "https://github.com/NETIX-AI-OSS/netix-protocol-core", tag = "v0.1.4-core", features = ["republish"] }

# Web daemon deps: lean; assets embedded, cookies/headers hand-rolled.
argon2 = { version = "0.5", optional = true }
axum = { version = "0.8", optional = true, default-features = false, features = ["http1", "json", "query", "tokio"] }
axum-server = { version = "0.7", optional = true, features = ["tls-rustls"] }
rand = { version = "0.8", optional = true }
serde = { version = "1.0", optional = true, features = ["derive"] }
subtle = { version = "2.6", optional = true }
tokio = { version = "1.48", optional = true, features = ["macros", "rt-multi-thread", "signal", "sync", "time"] }
tokio-stream = { version = "0.1", optional = true, default-features = false, features = ["sync"] }

[dev-dependencies]
tempfile = "3"

# Patched bacnet-transport: fixes broadcast port with ephemeral bind port.
[patch.crates-io]
bacnet-transport = { path = "vendor/bacnet-transport" }
